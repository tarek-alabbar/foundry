# ─────────────────────────────────────────────────────────────
#  Foundry — Project Configuration
#  Fill this in, then run: python generate.py
# ─────────────────────────────────────────────────────────────

project:
  name: wishlist          # kebab-case, used for all resource names
  team: tar-tech             # your team name

github:
  org: tarek-alabbar         # your GitHub username or organisation

cloud:
  provider: azure       # azure | aws | gcp
  region: uksouth       # provider-specific region identifier
                        #   Azure examples: uksouth, ukwest, westeurope, eastus
                        #   AWS examples:   eu-west-2, us-east-1, ap-southeast-1
                        #   GCP examples:   europe-west2, us-central1

language: dotnet          # node | python | dotnet | go | java
port: 3000              # port your app listens on inside the container

resources:
  cpu: "0.5"            # vCPU units (0.25 / 0.5 / 1.0 / 2.0)
  memory: "1Gi"         # memory (512Mi / 1Gi / 2Gi / 4Gi)

environments:           # remove any you don't need
  - dev
  - staging
  - prod

output_dir: ../wishlist   # where to generate the project (relative to this file)
                        # must not already exist

modules_version: v0.1.0  # git tag from github.com/<github.org>/terraform-modules
