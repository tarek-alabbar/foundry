services:
  app:
    build:
      context: .
      target: builder
    container_name: <<APP_NAME>>
    ports:
      - "<<PORT>>:<<PORT>>"
    environment:
      - PORT=<<PORT>>
    env_file:
      - .env.example
    volumes:
      - .:/src
    command: go run ./cmd/...
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:<<PORT>>/health"]
      interval: 30s
      timeout: 5s
      retries: 3
