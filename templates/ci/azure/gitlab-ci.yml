# ─────────────────────────────────────────────────────────────
#  GitLab CI — <<APP_NAME>>  [Azure / OIDC]
#  Requires GitLab 16.0+ with ID tokens enabled.
#
#  Required CI/CD variables (Settings → CI/CD → Variables):
#    AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#  Set by running: task oidc:setup
# ─────────────────────────────────────────────────────────────

default:
  image: ubuntu:22.04
  before_script:
    - apt-get update -q && apt-get install -y curl unzip
    - sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
    - curl -sL https://aka.ms/InstallAzureCLIDeb | bash

stages: [ci, deploy]

build-test:
  stage: ci
  services: [docker:24-dind]
  script:
    - task ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

deploy-staging:
  stage: deploy
  id_tokens:
    AZURE_OIDC_TOKEN:
      aud: api://AzureADTokenExchange
  script:
    - az login --service-principal
        --username "$AZURE_CLIENT_ID"
        --tenant "$AZURE_TENANT_ID"
        --federated-token "$AZURE_OIDC_TOKEN"
    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
    - task deploy ENV=staging TAG=$CI_COMMIT_SHA
  environment: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
