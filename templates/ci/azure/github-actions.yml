# ─────────────────────────────────────────────────────────────
#  GitHub Actions — <<APP_NAME>>  [Azure / OIDC]
#  No secrets stored. Authenticates via federated identity.
#
#  Required GitHub repo variables (Settings → Variables):
#    AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#  Set by running: task oidc:setup
# ─────────────────────────────────────────────────────────────

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with: { version: 3.x }
      - run: task ci

  deploy:
    name: Deploy
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure (OIDC — no secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: arduino/setup-task@v2
        with: { version: 3.x }

      - uses: hashicorp/setup-terraform@v3

      - name: Deploy to staging
        run: task deploy ENV=staging TAG=${{ github.sha }}
