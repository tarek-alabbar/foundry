# ─────────────────────────────────────────────────────────────
#  GitLab CI — <<APP_NAME>>  [AWS / OIDC]
#  Requires GitLab 16.0+ with ID tokens enabled.
#
#  Required CI/CD variables (Settings → CI/CD → Variables):
#    AWS_ROLE_ARN, AWS_REGION, AWS_ACCOUNT_ID
#  Set by running: task oidc:setup
# ─────────────────────────────────────────────────────────────

default:
  image: ubuntu:22.04
  before_script:
    - apt-get update -q && apt-get install -y curl unzip awscli
    - sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

stages: [ci, deploy]

build-test:
  stage: ci
  services: [docker:24-dind]
  script:
    - task ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

deploy-staging:
  stage: deploy
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com
  script:
    - >
      export $(aws sts assume-role-with-web-identity
      --role-arn "$AWS_ROLE_ARN"
      --role-session-name gitlab-ci
      --web-identity-token "$AWS_OIDC_TOKEN"
      --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]"
      --output text | awk '{print "AWS_ACCESS_KEY_ID="$1"\nAWS_SECRET_ACCESS_KEY="$2"\nAWS_SESSION_TOKEN="$3}')
    - task deploy ENV=staging TAG=$CI_COMMIT_SHA
  environment: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
